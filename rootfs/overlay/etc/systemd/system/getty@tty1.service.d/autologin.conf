# log the kiosk user in automatically on tty1 -> logind session with DRM access
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin kiosk --noclear --skip-login %I $TERM
# Otherwise systemd 257 queries the terminal size with an ANSI DSR query and
# reads the answer from tty1. plymouthd (animation) reads tty1 too and sometimes
# eats that answer -> (agetty) hangs forever and the kiosk never starts.
# With a fixed size (480x480, 8x16 font) nothing is queried.
TTYRows=30
TTYColumns=60
