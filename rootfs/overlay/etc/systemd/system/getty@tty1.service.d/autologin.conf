# kiosk-gebruiker automatisch aanmelden op tty1 -> logind-sessie met DRM-toegang
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin kiosk --noclear --skip-login %I $TERM
# systemd 257 vraagt anders de terminalgrootte op via een ANSI-DSR-query en
# leest het antwoord van tty1. plymouthd (animatie) leest tty1 ook en snoept
# dat antwoord soms op -> (agetty) blijft eeuwig hangen, kiosk start nooit.
# Met een vaste grootte (480x480, 8x16-font) wordt er niets gevraagd.
TTYRows=30
TTYColumns=60
