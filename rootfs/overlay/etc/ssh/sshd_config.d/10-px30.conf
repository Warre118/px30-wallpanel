PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
# host keys on /data (survive a reinstall); ssh.service runs ssh-keygen -A -f /data/ssh
HostKey /data/ssh/etc/ssh/ssh_host_ed25519_key
HostKey /data/ssh/etc/ssh/ssh_host_ecdsa_key
HostKey /data/ssh/etc/ssh/ssh_host_rsa_key
# keys: home dir, /data (survives a reinstall; px30-boot-ok copies admin's there)
# and a FAIL-SAFE copy baked into the image (root-owned, survives a factory
# reset; build: SSH_PUBKEY). The rescue mode (initramfs) has the same key for root.
AuthorizedKeysFile .ssh/authorized_keys /data/ssh/authorized_keys/%u /etc/ssh/failsafe_keys/%u
