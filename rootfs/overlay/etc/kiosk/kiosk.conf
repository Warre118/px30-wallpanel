# Kiosk defaults (sourced by kiosk-start, read by px30-panel).
# Own settings go to /data/kiosk/kiosk.conf (written by px30-panel, kept
# across reinstalls) and override these.

# Home Assistant dashboard; empty = setup via the phone (px30-panel)
KIOSK_URL=""
# renderer=gles: the default "modeset" renderer scans out WebKit's tiled GPU
# buffers without a modifier -> noise (see docs/development-notes.md)
COG_OPTS="--platform-params=renderer=gles"
