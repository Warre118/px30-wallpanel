<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- px30-agent reads the Wi-Fi signal from iwd (the kernel has no
     /proc/net/wireless). Read-only: list the objects, read diagnostics. -->
<busconfig>
  <policy user="px30-agent">
    <allow send_destination="net.connman.iwd"
           send_interface="org.freedesktop.DBus.ObjectManager" send_member="GetManagedObjects"/>
    <allow send_destination="net.connman.iwd"
           send_interface="net.connman.iwd.StationDiagnostic" send_member="GetDiagnostics"/>
  </policy>
</busconfig>
