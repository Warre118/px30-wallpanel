# PX30 panel: one speaker (RK809 class-D, "Playback Mux" = SPK).
# Everything goes through dmix so px30-audio-keepalive can keep the codec and
# speaker amplifier powered with silence: every fresh power-up gave an audible
# distorted onset (11-11-2026). Stereo is mixed down to the single speaker.
pcm.dmixed {
	type dmix
	ipc_key 1024
	ipc_perm 0666
	slave {
		pcm "hw:CARD=rk809,DEV=0"
		rate 48000
		channels 2
		format S16_LE
		period_size 1024
		buffer_size 8192
	}
}
pcm.mono {
	type route
	slave.pcm "dmixed"
	slave.channels 2
	ttable.0.0 0.5
	ttable.1.0 0.5
	ttable.0.1 0.5
	ttable.1.1 0.5
}
# Microphones: two PDM MEMS mics on the SoC PDM controller (card "pdmmic").
# The raw level is low (speech around -50 dBFS): softvol adds a runtime gain,
# "Mic Capture Volume" on card pdmmic (-10..+30 dB; px30-audio.service sets
# +24 dB at boot):
#   amixer -c pdmmic sset Mic 80%
pcm.micraw {
	type hw
	card pdmmic
	device 0
	channels 4
}
# the mics are on PDM SDI1 = channels 2 and 3 (SDI0 is not connected)
pcm.micsel {
	type route
	slave.pcm "micraw"
	slave.channels 4
	ttable.0.2 1
	ttable.1.3 1
}
pcm.micvol {
	type softvol
	slave.pcm "micsel"
	control {
		name "Mic Capture Volume"
		card pdmmic
	}
	min_dB -10.0
	max_dB 30.0
}
pcm.mic {
	type plug
	slave.pcm "micvol"
}
# Cards by name, not index: with two cards (rk809, pdmmic) the order is not fixed.
pcm.!default {
	type asym
	playback.pcm {
		type plug
		slave.pcm "mono"
	}
	capture.pcm "mic"
}
ctl.!default {
	type hw
	card rk809
}
