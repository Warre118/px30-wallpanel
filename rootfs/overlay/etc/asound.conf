# PX30 panel: one speaker (RK809 class-D, "Playback Mux" = SPK).
# Everything goes through dmix so px30-audio-keepalive can keep the codec and
# speaker amplifier powered with silence: every fresh power-up gave an audible
# distorted onset (11-11-2026). Stereo is mixed down to the single speaker.
pcm.dmixed {
	type dmix
	ipc_key 1024
	ipc_perm 0666
	slave {
		pcm "hw:0,0"
		rate 48000
		channels 2
		format S16_LE
		period_size 1024
		buffer_size 8192
	}
}
pcm.mono {
	type route
	slave.pcm "dmixed"
	slave.channels 2
	ttable.0.0 0.5
	ttable.1.0 0.5
	ttable.0.1 0.5
	ttable.1.1 0.5
}
pcm.!default {
	type plug
	slave.pcm "mono"
}
ctl.!default {
	type hw
	card 0
}
