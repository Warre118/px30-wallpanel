<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wi-Fi setup</title>
<style>
  :root { --bg:#101418; --fg:#e8eef2; --mut:#8a98a4; --btn:#22303b; --bad:#ff8f84; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:14px/1.3 "DejaVu Sans",sans-serif; overflow:hidden; user-select:none; }
  .wrap { height:100%; display:flex; flex-direction:column; align-items:center; padding:10px; gap:6px; }
  h1 { margin:0; font-size:18px; }
  .qrs { display:flex; gap:12px; }
  .q { display:flex; flex-direction:column; align-items:center; gap:4px; width:208px; }
  .q b { font-size:15px; }
  .qr { width:200px; height:200px; background:#fff; border-radius:10px; padding:4px; }
  .qr svg { width:100%; height:100%; }
  .mut { color:var(--mut); font-size:12px; text-align:center; }
  .big { font-size:17px; font-weight:bold; letter-spacing:1px; }
  .pin { font-size:24px; letter-spacing:5px; font-weight:bold; }
  #err { color:var(--bad); text-align:center; min-height:18px; }
  #msg { text-align:center; min-height:18px; }
  button { border:0; border-radius:10px; background:var(--btn); color:var(--fg); font:inherit; padding:9px 18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Connect the panel to your Wi-Fi</h1>
  <div class="qrs">
    <div class="q"><b>1. Join this Wi-Fi</b><div class="qr" id="q1"></div>
      <div class="big" id="ssid">PX30-....</div><div class="mut">password <span class="big" id="pass"></span></div></div>
    <div class="q"><b>2. Then scan this</b><div class="qr" id="q2"></div>
      <div class="pin" id="pin">------</div><div class="mut" id="url"></div></div>
  </div>
  <div id="err"></div>
  <div id="msg"></div>
  <button id="cancel" style="display:none">Cancel</button>
</div>
<script>
const K = new URLSearchParams(location.search).get("k");
const $ = s => document.querySelector(s);
let gotQr = false;
async function poll() {
  try {
    const r = await fetch("/api/state" + (gotQr ? "" : "?qr=1"), { headers:{ "X-Token":K } });
    if (r.status === 403) { $("#msg").textContent = "expired"; return; }
    const s = await r.json();
    if (s.qr1 && s.qr2) { $("#q1").innerHTML = s.qr1; $("#q2").innerHTML = s.qr2; gotQr = true; }
    $("#ssid").textContent = s.ssid || "";
    $("#pass").textContent = s.passphrase || "";
    $("#pin").textContent = s.pin || "------";
    $("#url").textContent = "or open " + (s.setup_url || "") + " and enter the PIN";
    $("#err").textContent = s.error || "";
    $("#msg").textContent = s.phase === "joining" ? "Connecting to your network..." :
                            s.phase === "probe" ? "Trying the known network again..." : (s.msg || "");
    $("#cancel").style.display = s.can_cancel ? "" : "none";
  } catch (e) { $("#msg").textContent = "..."; }
}
$("#cancel").onclick = () => fetch("/api/action", { method:"POST", headers:{ "X-Token":K, "Content-Type":"application/json" },
  body:JSON.stringify({ action:"hotspot_cancel" }) });
poll(); setInterval(poll, 2000);
</script>
</body>
</html>
