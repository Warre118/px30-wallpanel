# TubesZB EFR32 MGM210 2022 - stand-alone Zigbee router (repeater).
# Overlay on manifests/nabucasa/zbt2/zbt2_router.yaml (Home Assistant Connect ZBT-2,
# an MG24 board with RGB LEDs, an accelerometer and a button). Everything that
# belongs to that hardware is removed; what stays is the router application
# (src/zigbee_router) with its CLI on the UART, including the command that
# returns to the Gecko bootloader.
#
# EXPERIMENTAL, never built or flashed. Disabled in config.yaml until a manual
# test build works. Known unknowns:
#  - zbt2_router_callbacks is removed; if the application needs callbacks from
#    it the link fails and a small replacement component is needed
#  - the ZCL configuration (LED clusters) is kept as is
# Way back: the ESP32 button "Zigbee radio to bootloader (flash mode)" always
# works on the TubesZB, whatever the firmware.

set:
  name: TubesZB MGM210 2022 Zigbee Router
  device: MGM210PA32JIA
  configuration:
    SL_SPIDRV_EUSART_WS2812_CS_CONTROL: null
    SL_IOSTREAM_USART_VCOM_FLOW_CONTROL_TYPE: usartHwFlowControlNone
    # SDK bug on the MGM210 (see the Yellow manifests)
    SL_CLOCK_MANAGER_PCLK_DIVIDER: SL_CLOCK_MANAGER_PCLK_DIV_MIN

remove_sdk_extensions: [nabucasa_hardware]
remove_components:
  - spidrv_eusart
  - emlib_i2c
  - i2cspm
  - simple_button
  - ws2812_driver
  - qma6100p_driver
  - zbt2_reset_button
  - zbt2_router_callbacks
remove_defines:
  - SL_SPIDRV_EUSART_WS2812_.*
  - WS2812_.*
  - SL_I2CSPM_INST_.*
  - SL_SIMPLE_BUTTON_PIN_HOLE_BUTTON_.*
  - ZBT2_.*
  # the MGM210 module brings its own crystal settings
  - SL_CLOCK_MANAGER_HFXO_.*
  # ZBT-2 product id (blocks cross-flashing between Nabu Casa devices)
  - SL_APPLICATION_PRODUCT_ID

set_matching:
  SL_IOSTREAM_USART_VCOM_BAUDRATE: 115200
  SL_IOSTREAM_USART_VCOM_FLOW_CONTROL_TYPE: usartHwFlowControlNone

pins:
  SL_IOSTREAM_USART_VCOM_:
    TX: PA06
    RX: PA05
    CTS: PC01
    RTS: PD02

set_defines:
  SL_CLOCK_MANAGER_PCLK_DIVIDER: SL_CLOCK_MANAGER_PCLK_DIV_MIN
